        document.addEventListener('DOMContentLoaded', () => {
            // Render Topics Table
            const tbody = document.getElementById('topics-tbody');
            topicsList.forEach(item => {
                const firstCommaIdx = item.indexOf(',');
                const id = item.substring(0, firstCommaIdx);
                const title = item.substring(firstCommaIdx + 1);
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${id}</td><td>${title}</td>`;
                tbody.appendChild(tr);
            });

            // Render Questions
            const qContainer = document.getElementById('questions-container');
            quizData.forEach((section, sIndex) => {
                const topicHtml = `<h2 class="topic-header">${section.topic}</h2>`;
                qContainer.insertAdjacentHTML('beforeend', topicHtml);

                section.questions.forEach((q, qIndex) => {
                    const blockId = `q-${sIndex}-${qIndex}`;
                    let optionsHtml = '';
                    if (q.options && q.options.length > 0) {
                        optionsHtml = `<ul class="options-list">`;
                        q.options.forEach(opt => {
                            optionsHtml += `<li>${opt}</li>`;
                        });
                        optionsHtml += `</ul>`;
                    }

                    // Store stringified data for onclick inline JS
                    const encodedQuote = encodeURIComponent(q.quote);
                    const encodedExplanation = encodeURIComponent(q.explanation);

                    const qHtml = `
                        <div class="question-block">
                            <div class="question-text">${q.type}<br>${q.text}</div>
                            ${optionsHtml}
                            
                            <div class="actions">
                                <button class="btn btn-check" onclick="toggleAnswer('${blockId}')">تحقق</button>
                                <button class="btn btn-ref" onclick="openModal('${encodedQuote}', '${encodedExplanation}')">المرجع</button>
                            </div>

                            <div id="${blockId}-ans" class="answer-block">
                                ${q.answer}
                            </div>
                        </div>
                    `;
                    qContainer.insertAdjacentHTML('beforeend', qHtml);
                });
            });
        });

        // Tab Switching Logic
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // Toggle Answer Visibility
        function toggleAnswer(blockId) {
            const ansDiv = document.getElementById(`${blockId}-ans`);
            if (ansDiv.style.display === 'block') {
                ansDiv.style.display = 'none';
            } else {
                ansDiv.style.display = 'block';
            }
        }

        // Modal Logic
        const modal = document.getElementById('ref-modal');
        const quoteEl = document.getElementById('modal-quote');
        const expEl = document.getElementById('modal-explanation');

        function openModal(encQuote, encExp) {
            const quote = decodeURIComponent(encQuote);
            const explanation = decodeURIComponent(encExp);
            
            // Format Quote with italics
            quoteEl.innerHTML = `"${quote.replace(/\n/g, '<br>')}"`;
            
            // Add Arabic Explanation
            expEl.innerHTML = `<strong>الشرح المبسط:</strong> ${explanation}`;
            
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
